# SPDX-License-Identifier: Apache-2.0
#
# Publishes a release when a tag vX.Y.Z is pushed: full test suite, signed artifacts on Maven
# Central, and a GitHub Release with the jar, checksums, SBOM and build provenance.
#
# Repository secrets required (see docs/releasing.md):
#   CENTRAL_USERNAME, CENTRAL_PASSWORD   Maven Central Portal user token
#   GPG_PRIVATE_KEY, GPG_PASSPHRASE      release signing key
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write        # create the GitHub Release
      id-token: write        # sign the build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ./mvnw -B -ntp versions:set -DnewVersion="$VERSION"
          # reproducible build timestamp: the tagged commit's time
          echo "OUTPUT_TIMESTAMP=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"

      - name: Full test suite
        run: ./mvnw -B -ntp verify -Dproject.build.outputTimestamp="$OUTPUT_TIMESTAMP"

      - name: Sign and publish to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw -B -ntp -Prelease -DskipTests -Dproject.build.outputTimestamp="$OUTPUT_TIMESTAMP" deploy

      - name: Checksums
        run: |
          cd target
          for f in scim-outbound-for-keycloak-$VERSION.jar scim-outbound-for-keycloak-$VERSION-sbom.json; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: target/scim-outbound-for-keycloak-${{ env.VERSION }}.jar

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --verify-tag \
            --notes "See [CHANGELOG.md](CHANGELOG.md) for details. Verify downloads with the .sha256 and .asc files or \`gh attestation verify\`." \
            target/scim-outbound-for-keycloak-$VERSION.jar \
            target/scim-outbound-for-keycloak-$VERSION.jar.asc \
            target/scim-outbound-for-keycloak-$VERSION.jar.sha256 \
            target/scim-outbound-for-keycloak-$VERSION-sbom.json \
            target/scim-outbound-for-keycloak-$VERSION-sbom.json.sha256
