# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, license check, unit tests, SBOM
        run: ./mvnw -B -ntp -DskipITs verify
      - name: Upload coverage and SBOM
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            target/site/jacoco/
            target/*-sbom.json
          if-no-files-found: warn

  integration:
    name: Integration tests (Keycloak ${{ matrix.keycloak }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # keep in sync with the compatibility table in README.md
        keycloak: ["26.6.4", "26.7.5", "26.8.0", "26.8.1"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit and integration tests
        run: ./mvnw -B -ntp verify -Dkeycloak.version=${{ matrix.keycloak }}
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failsafe-reports-${{ matrix.keycloak }}
          path: target/failsafe-reports/
