name: Feature request
description: Suggest an improvement or a new capability
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to achieve, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: security
    attributes:
      label: Security impact
      options:
        - label: This change does not weaken a secure default (or the weaker behaviour is opt-in).
